<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.45; }
      50% { transform: translate(40px, -25px) scale(1.15); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      50% { transform: translate(-35px, 20px) scale(1.12); opacity: 0.6; }
    }
    @keyframes scanLine {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    @keyframes streamData {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes liveSignal {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    .orb-1 { animation: pulseOrb1 9s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 11s ease-in-out infinite; transform-origin: 1000px 300px; }
    .scanner { animation: scanLine 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .stream-line { stroke-dasharray: 8 6; animation: streamData 3s linear infinite; }
    .pill-float-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill 6s ease-in-out 1s infinite; }
    .pill-float-3 { animation: floatPill 5.5s ease-in-out 2s infinite; }
    .live-dot { animation: liveSignal 1.8s ease-in-out infinite; transform-origin: center; }

    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: -0.8px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.4px;
    }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Animated Glowing Orbs -->
  <g>
    <circle class="orb-1" cx="220" cy="120" r="140" fill="#0284c7" filter="url(#glowCyan)" />
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#7c3aed" filter="url(#glowPurple)" />
    <circle cx="600" cy="210" r="90" fill="#38bdf8" opacity="0.15" filter="url(#glowCyan)" />
  </g>

  <!-- Subtle Blueprint / Grid Layer -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Decorative Live Stream Wave Lines (Behind Content) -->
  <g opacity="0.45">
    <path class="stream-line" d="M 50,330 C 250,290 400,370 650,320 C 900,270 1050,350 1150,320" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="stream-line" d="M 50,350 C 280,310 450,390 700,340 C 950,290 1080,370 1150,340" fill="none" stroke="#818cf8" stroke-width="1.8" />
  </g>

  <!-- Foreground Content Group -->
  <!-- Top Live Badge & Status -->
  <g transform="translate(600, 65)" text-anchor="middle">
    <!-- Live Pill Container -->
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#cardGlow)" />
    <circle class="live-dot" cx="-110" cy="0" r="5" fill="#ef4444" />
    <circle cx="-110" cy="0" r="8" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
    <text x="10" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="1.2">LIVE ECOSYSTEM • REAL DEVICES</text>
  </g>

  <!-- Title & Subtitle in absolute Foreground -->
  <g transform="translate(600, 145)" text-anchor="middle">
    <text class="main-title" x="0" y="0" fill="url(#primaryGrad)">
      Awesome Interactive Live Mobile App Testing
    </text>
    <text class="subtitle" x="0" y="42">
      Curated Real Device Clouds, Remote Farms, Web Streaming &amp; Emulators
    </text>
    <text x="0" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      Android (.apk, .aab) &amp; iOS (.ipa) • WebRTC / H.264 Mirroring • Low-Latency Remote Debugging
    </text>
  </g>

  <!-- Floating Feature / Architecture Pills (Foreground Bottom) -->
  <g transform="translate(0, 290)">
    <!-- Pill 1: Real Device Farm -->
    <g class="pill-float-1" transform="translate(110, 0)">
      <rect width="210" height="52" rx="26" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.4" filter="url(#cardGlow)" />
      <circle cx="30" cy="26" r="14" fill="#0284c7" fill-opacity="0.25" />
      <text x="30" y="31" text-anchor="middle" font-size="15">📱</text>
      <text class="pill-text" x="56" y="27" fill="#f8fafc">REAL DEVICE FARMS</text>
      <text x="56" y="41" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">USB Hubs &amp; Remote ADB</text>
    </g>

    <!-- Pill 2: WebRTC Screen Mirroring -->
    <g class="pill-float-2" transform="translate(355, 0)">
      <rect width="230" height="52" rx="26" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.4" filter="url(#cardGlow)" />
      <circle cx="30" cy="26" r="14" fill="#4f46e5" fill-opacity="0.25" />
      <text x="30" y="31" text-anchor="middle" font-size="15">⚡</text>
      <text class="pill-text" x="56" y="27" fill="#f8fafc">LOW-LATENCY STREAM</text>
      <text x="56" y="41" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">scrcpy &amp; WebRTC / H.264</text>
    </g>

    <!-- Pill 3: Cloud Emulators -->
    <g class="pill-float-3" transform="translate(620, 0)">
      <rect width="220" height="52" rx="26" fill="#0f172a" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.4" filter="url(#cardGlow)" />
      <circle cx="30" cy="26" r="14" fill="#9333ea" fill-opacity="0.25" />
      <text x="30" y="31" text-anchor="middle" font-size="15">☁️</text>
      <text class="pill-text" x="56" y="27" fill="#f8fafc">CLOUD EMULATORS</text>
      <text x="56" y="41" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Docker-Android &amp; AIC</text>
    </g>

    <!-- Pill 4: Enterprise & OSS -->
    <g class="pill-float-1" transform="translate(875, 0)">
      <rect width="215" height="52" rx="26" fill="#0f172a" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.4" filter="url(#cardGlow)" />
      <circle cx="30" cy="26" r="14" fill="#0891b2" fill-opacity="0.25" />
      <text x="30" y="31" text-anchor="middle" font-size="15">🛠️</text>
      <text class="pill-text" x="56" y="27" fill="#f8fafc">SAAS &amp; OPEN SOURCE</text>
      <text x="56" y="41" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Ranked by Scale &amp; Stars</text>
    </g>
  </g>

  <!-- Bottom Subtle Line -->
  <line x1="100" y1="380" x2="1100" y2="380" stroke="url(#primaryGrad)" stroke-width="1" opacity="0.3" />
</svg>
